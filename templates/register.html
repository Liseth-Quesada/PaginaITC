{% extends "base.html" %}
{% block content %}


<section class="login-section">
    <img class="login-bg" src="{{ url_for('static', filename='img/ImgCarrusel2.jpg') }}" alt="Fondo registro">
    <form method="POST" class="login-form register-form">
        <h2>Registro de Usuario</h2>
        <div class="form-group">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
        </div>
        <div class="form-group">
            <input type="email" name="email" placeholder="Correo electrónico" required>
        </div>
        <div class="form-group">
            <input type="tel" name="tel" placeholder="Teléfono" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="boton-container">
            <button class="btn" type="submit">Registrarse</button>
        </div>

        <div class="login-footer">
            <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
        </div>
    </form>
</section>


<footer class="footer-bar">
    <p>© 2025 Inaldo Turizo Correa — Construcción e Ingeniería responsable</p>
</footer>

{% endblock %}
